name: Import Override Playground source

on:
  push:
    branches:
      - codex/override-playground-integration

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand tracked simulator source
        shell: bash
        run: |
          cat override-playground-source-v2.tar.gz.part-* > override-playground-source.tar.gz
          tar -xzf override-playground-source.tar.gz
          rm -f override-playground-source.tar.gz override-playground-source-v2.tar.gz.part-*
          rm -f .github/workflows/import-override.yml

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Override Playground simulator"
          git push origin HEAD:${{ github.ref_name }}
